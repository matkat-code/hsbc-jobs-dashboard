name: Refresh HSBC jobs
on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 05:00 Singapore (SGT, UTC+8)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python scrape_hsbc.py
      - run: |
          git config user.name "jobs-bot"; git config user.email "bot@users.noreply.github.com"
          git add jobs.json; git diff --cached --quiet || git commit -m "Daily refresh" && git push
